name: Scheduled Crawl

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

concurrency:
  group: scheduled-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run crawl
        run: pnpm crawl:once
        env:
          IMAGE_GITHUB_OWNER: ${{ secrets.IMAGE_GITHUB_OWNER }}
          IMAGE_GITHUB_REPO: ${{ secrets.IMAGE_GITHUB_REPO }}
          IMAGE_GITHUB_BRANCH: ${{ secrets.IMAGE_GITHUB_BRANCH }}
          IMAGE_GITHUB_TOKEN: ${{ secrets.IMAGE_GITHUB_TOKEN }}
          NEXT_PUBLIC_CDN_BASE_URL: ${{ secrets.NEXT_PUBLIC_CDN_BASE_URL }}

      - name: Resolve next crawl
        if: ${{ always() }}
        id: next
        run: node scripts/resolve-next-crawl.mjs
        env:
          IMAGE_GITHUB_OWNER: ${{ secrets.IMAGE_GITHUB_OWNER }}
          IMAGE_GITHUB_REPO: ${{ secrets.IMAGE_GITHUB_REPO }}
          IMAGE_GITHUB_BRANCH: ${{ secrets.IMAGE_GITHUB_BRANCH }}
          IMAGE_GITHUB_TOKEN: ${{ secrets.IMAGE_GITHUB_TOKEN }}

      - name: Dispatch next crawl
        if: ${{ always() && steps.next.outputs.should_dispatch == 'true' }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/crawl.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}"
          echo "Queued next crawl run on ref=${GITHUB_REF_NAME}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
