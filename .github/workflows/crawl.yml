name: Scheduled Crawl

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: scheduled-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run crawl
        run: pnpm crawl:once
        env:
          IMAGE_GITHUB_OWNER: ${{ secrets.IMAGE_GITHUB_OWNER }}
          IMAGE_GITHUB_REPO: ${{ secrets.IMAGE_GITHUB_REPO }}
          IMAGE_GITHUB_BRANCH: ${{ secrets.IMAGE_GITHUB_BRANCH }}
          IMAGE_GITHUB_TOKEN: ${{ secrets.IMAGE_GITHUB_TOKEN }}
          NEXT_PUBLIC_CDN_BASE_URL: ${{ secrets.NEXT_PUBLIC_CDN_BASE_URL }}
